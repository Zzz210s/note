# tmux 配置：为 AI 对话类富色 TUI 优化
# 安装位置：~/.tmux.conf

# 1) 256 色 + 真彩色(RGB)透传，避免 TUI 花屏 / 颜色丢失
#    外层终端即便只报告 xterm，也声明它支持 RGB（VS Code 终端实际支持真彩色）
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm:RGB"

# 2) 回滚缓冲加大（AI 输出很长，默认 2000 行不够）
set -g history-limit 50000

# 3) 降低 ESC 键延迟（默认 500ms 会让 TUI 里按 ESC 明显卡顿）
set -g escape-time 10

# 4) 鼠标：关闭 tmux 鼠标捕获，保留图形终端原生选区/复制。
#    上下文浏览改用键盘 copy 模式（见 4b）。
set -g mouse off

# 4b) 键盘翻历史（vim 键位）：先 Ctrl+b [ 进入 copy 模式，再：
#     j/k=逐行，Ctrl+d/Ctrl+u=半屏，Ctrl+f/Ctrl+b=整屏，g/G=首尾，?//=搜索，q/Esc=退出。
#     与 TUI 里「方向键切换输入内容」互不干扰。
set -g mode-keys vi

# 4c) 复制内容通过 OSC 52 写入系统剪贴板
set -g set-clipboard on

# 4d) 透传修饰键，让 Shift+Enter / Ctrl+Enter 在 tmux 里不被吞掉
set -g extended-keys on

# 5) 重启后恢复 (tmux-resurrect + tmux-continuum，由 TPM 管理)
#    自动每 15 分钟保存会话布局；tmux 服务启动时自动恢复。
#    注意：无法恢复进程当时的内存运行状态，恢复是「重启进程 + 续历史」。
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'claude'

set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# TPM 初始化（必须放在配置末尾）
run '~/.tmux/plugins/tpm/tpm'
